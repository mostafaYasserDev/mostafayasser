        let currentKey = 'client_reply';

        function renderCurrentTemplate() {
            const tmpl = TEMPLATES[currentKey];
            if (!tmpl) return;

            document.getElementById('template-tag').textContent = tmpl.tag;
            document.getElementById('template-desc').textContent = tmpl.desc;
            document.getElementById('preview-subject-label').textContent = tmpl.subject;
            document.getElementById('email-preview-container').innerHTML = tmpl.htmlContent;
            document.getElementById('modal-code-area').value = tmpl.htmlContent.trim();

            // Update Gmail Link
            const gmailUrl = "https://mail.google.com/mail/?view=cm&fs=1" +
                (tmpl.recipient ? "&to=" + encodeURIComponent(tmpl.recipient) : "") +
                "&su=" + encodeURIComponent(tmpl.subject) +
                "&body=" + encodeURIComponent(tmpl.plainText);
            document.getElementById('btn-open-gmail').href = gmailUrl;
        }

        function switchTemplate(key, e) {
            if (!TEMPLATES[key]) return;
            currentKey = key;

            // Update tab buttons
            const btns = document.querySelectorAll('.tab-btn');
            btns.forEach(b => b.classList.remove('active'));
            if (e && e.currentTarget) {
                e.currentTarget.classList.add('active');
            }

            renderCurrentTemplate();
            showToast('تم التبديل إلى: ' + TEMPLATES[key].title);
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-text').textContent = text;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // Copy Rich Formatted HTML directly for pasting into Gmail (Ctrl + V with full colors & styles)
        async function copyRichFormattedEmail() {
            const emailBox = document.getElementById('email-preview-container');
            try {
                const htmlContent = emailBox.innerHTML;
                const plainText = emailBox.innerText;

                const blobHtml = new Blob([htmlContent], { type: 'text/html' });
                const blobText = new Blob([plainText], { type: 'text/plain' });

                if (navigator.clipboard && window.ClipboardItem) {
                    const data = [new ClipboardItem({
                        'text/html': blobHtml,
                        'text/plain': blobText
                    })];
                    await navigator.clipboard.write(data);
                    showToast('✨ تم النسخ بتنسيق Gmail الملون! الصقه الآن (Ctrl + V)');
                } else {
                    const range = document.createRange();
                    range.selectNodeContents(emailBox);
                    const sel = window.getSelection();
                    sel.removeAllRanges();
                    sel.addRange(range);
                    document.execCommand('copy');
                    sel.removeAllRanges();
                    showToast('✨ تم النسخ! الصقه الآن في Gmail (Ctrl + V)');
                }
            } catch (err) {
                console.error('Rich copy error:', err);
                const range = document.createRange();
                range.selectNodeContents(emailBox);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
                document.execCommand('copy');
                sel.removeAllRanges();
                showToast('✨ تم النسخ! الصقه الآن في Gmail (Ctrl + V)');
            }
        }

        function copyHtmlEmail() {
            const html = TEMPLATES[currentKey].htmlContent.trim();
            navigator.clipboard.writeText(html).then(() => {
                showToast('✅ تم نسخ كود الـ HTML بنجاح!');
            }).catch(() => {
                fallbackCopy(html);
            });
        }

        function copyPlainText() {
            const text = TEMPLATES[currentKey].plainText.trim();
            navigator.clipboard.writeText(text).then(() => {
                showToast('✅ تم نسخ النص بنجاح!');
            }).catch(() => {
                fallbackCopy(text);
            });
        }

        function copyModalCode() {
            const code = document.getElementById('modal-code-area').value;
            navigator.clipboard.writeText(code).then(() => {
                showToast('✅ تم نسخ كود القالب!');
                closeCodeModal();
            });
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            showToast('✅ تم النسخ بنجاح!');
        }

        function openCodeModal() {
            document.getElementById('code-modal').classList.add('active');
        }

        function closeCodeModal() {
            document.getElementById('code-modal').classList.remove('active');
        }

        window.onclick = function (event) {
            const modal = document.getElementById('code-modal');
            if (event.target === modal) {
                closeCodeModal();
            }
        };

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            renderCurrentTemplate();
        });
